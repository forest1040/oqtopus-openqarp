[project]
name = "oqtopus-openqarp-workspace"
version = "0.1.0"
description = "Local OpenQARP verification and OQTOPUS integration planning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openqarp",
    "oqtopus-client",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6.100",
]

[tool.uv.sources]
openqarp = { path = "ref/openqarp", editable = true }
oqtopus-client = { path = "ref/oqtopus-client", editable = true }
