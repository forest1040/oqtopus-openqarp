[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openqarp-oqtopus"
version = "0.1.0"
description = "OpenQARP sampling and estimation through OQTOPUS Cloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openqarp",
    "oqtopus-client",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6.100",
]

[tool.uv.sources]
openqarp = { path = "ref/openqarp", editable = true }
oqtopus-client = { path = "ref/oqtopus-client", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
